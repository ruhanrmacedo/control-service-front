<section class="modal-login">
  <h1 mat-dialog-title class="login-title">Bem-Vindo ao ControlService</h1>
  <p class="subtitle">Para acessar, insira seu E-mail cadastrado ou solicete ao responsável para criar
    uma conta!</p>
  <div mat-dialog-content>
    <form class="form-login" (ngSubmit)="onLogin()">
      <div class="input-field">
        <label for="login">Email:</label>
        <input type="text" id="login" name="login" [(ngModel)]="login" autocomplete="username" required />
      </div>
      <div class="input-field">
        <label for="password">Senha:</label>
        <input type="password" id="senha" name="password" autocomplete="current-password" [(ngModel)]="senha"
          required />
      </div>
      <a href="#" class="esqueci-senha">Esqueci a senha</a>

      <div mat-dialog-actions>
        <button type="submit" class="btn-entrar" mat-flat-button>Entrar</button>
        <button class="btn-cancelar" mat-flat-button (click)="limparFormulario()">Limpar</button>
      </div>
    </form>
  </div>
</section>
<section class="modal-mensagem modal-sucesso" *ngIf="loginSucesso">
  <h2>Login bem-sucedido!</h2>
  <p>Bem-vindo, {{ usuarioLogado }}</p>
  <button (click)="fecharModal()">OK</button>
</section>
<section class="modal-mensagem modal-erro" *ngIf="erroLogin">
  <h2>Erro no login</h2>
  <p>{{ mensagemErro }}</p>
  <button (click)="fecharModalErro()">OK</button>
</section>
