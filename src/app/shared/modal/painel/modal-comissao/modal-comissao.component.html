<div id="print-container" class="print-container">
    <!-- Conteúdo para imprimir -->
    <h1>{{ nomeTecnico }}</h1>
    <table mat-table [dataSource]="contratosExecutadosDataSource.data" class="mat-elevation-z8">
        <!-- Colunas da tabela -->
        <ng-container matColumnDef="contrato">
            <th mat-header-cell *matHeaderCellDef> Contrato </th>
            <td mat-cell *matCellDef="let element"> {{element.contrato}} </td>
        </ng-container>
        <ng-container matColumnDef="os">
            <th mat-header-cell *matHeaderCellDef> OS </th>
            <td mat-cell *matCellDef="let element"> {{element.os}} </td>
        </ng-container>
        <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef> Data </th>
            <td mat-cell *matCellDef="let element"> {{element.data}} </td>
        </ng-container>
        <ng-container matColumnDef="descricaoServico">
            <th mat-header-cell *matHeaderCellDef> Descrição Serviço </th>
            <td mat-cell *matCellDef="let element"> {{element.descricaoServico}} </td>
        </ng-container>
        <ng-container matColumnDef="comissao">
            <th mat-header-cell *matHeaderCellDef> Gratificação </th>
            <td mat-cell *matCellDef="let element"> {{element.comissao}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <div class="comissao-total-container">
        Gratificação Total: {{ comissaoTotal | currency:'BRL' }}
    </div>
    <div class="button-container">
        <button (click)="generatePDF()" class="print-btn">Imprimir</button>
        <button (click)="fecharModal()" class="close-btn">Fechar</button>
    </div>
</div>
