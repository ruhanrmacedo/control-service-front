<app-card variant="secondary">
    <mat-card-header>
        <mat-card-title>Gerenciar Serviços</mat-card-title>
      </mat-card-header>
    <img 
        src="assets/imagens/cadastroNovoServico.png" 
        alt="Imagem de cadastro de servico">
    <mat-card-content>
        <p>
            Clique no botão abaixo para começar a gerenciar serviço.

        <button mat-flat-button color="primary" (click)="navigateToServico()">GERENCIAR SERVIÇO</button>
      </mat-card-actions>
</app-card>
